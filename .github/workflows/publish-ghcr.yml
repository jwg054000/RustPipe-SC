name: Publish GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jwg054000/rustpipe-sc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/jwg054000/RustPipe-SC
            org.opencontainers.image.description=Fast single-cell RNA-seq downstream of Cell Ranger / nf-core/scrnaseq
            org.opencontainers.image.licenses=GPL-3.0
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.3.0,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record digest
        run: |
          {
            echo "## rustpipe-sc GHCR digest"
            echo ""
            echo "linux/amd64. Pin this string. Do not float on \`latest\`. Do not \`docker build\` this image inside prairie-rna-stream. GHCR is public; anonymous HEAD 401 is not private."
            echo ""
            echo '```'
            echo "${IMAGE}:0.3.0@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
